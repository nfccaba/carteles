    h1 { font-size: 22px; margin-bottom: 15px; text-align: center; color: #1a73e8; }
    
    .scanner-box { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .btn-scan { background: #34a853; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    #reader { width: 100%; margin-top: 10px; display: none; border-radius: 8px; overflow: hidden; }

    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: background 0.3s ease; }
    .card.highlight { background: #e8f0fe; border: 2px solid #1a73e8; }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
    
    input[type="url"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 4px; transition: border-color 0.2s; }
    input.input-error { border-color: #d93025 !important; background-color: #fce8e6; }
    
    .validation-msg { font-size: 11px; color: #d93025; font-weight: bold; min-height: 15px; margin-bottom: 6px; }

    .quick-tools { display: flex; gap: 6px; margin-bottom: 8px; }
    .btn-quick { background: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; padding: 6px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; text-align: center; }
    .btn-quick.clear-btn { background: #fce8e6; color: #c5221f; border-color: #fad2cf; flex: 0.5; }
    .btn-quick:active { opacity: 0.8; }
    
    button.btn-save { width: 100%; background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 5px; }
    button.logout { background: #d93025; width: auto; padding: 5px 10px; margin: 0; }
    button:disabled { background: #9aa0a6 !important; cursor: not-allowed; }
    
    .status { font-size: 12px; font-weight: normal; }
    .msg-feedback { font-size: 12px; font-weight: bold; text-align: center; margin-top: 5px; height: 16px; }
    .user-info { display: flex; justify-content: space-between; align-items: center; background: #e8f0fe; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
    #login-box { display: block; }
    #panel-box { display: none; }
  </style>
</head>

  <div class="container">
    <h1>Panel de Carteles QR</h1>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-box" class="card">
      <h2 style="font-size: 16px; margin-bottom: 15px; text-align: center;">Iniciar Sesión</h2>
      <input type="email" id="email" placeholder="Correo Electrónico">

      <button class="btn-save" onclick="iniciarSesion()">Ingresar</button>
      <p id="error-login" style="color: red; font-size: 12px; margin-top: 10px; text-align: center; font-weight: bold;"></p>

    <!-- PANTALLA DEL PANEL -->

      <div class="user-info">
        <span id="user-email">Cargando...</span>
        <button class="logout" onclick="cerrarSesion()">Salir</button>
      </div>

      <div id="lista-carteles">Cargando carteles...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCC3zrf5vYbgM7lA7ULEBE_e1bGCtt6Krg",
      authDomain: "nfccaba-5e8d5.firebaseapp.com",
      databaseURL: "https://nfccaba-5e8d5-default-rtdb.firebaseio.com",
      projectId: "nfccaba-5e8d5",
      storageBucket: "nfccaba-5e8d5.firebasestorage.app",
      messagingSenderId: "104003409871",
      appId: "1:104003409871:web:eb477d997538e01de3e4ba",
      measurementId: "G-B1BNGY8WSC"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    let usuarioActual = null;
    let html5QrcodeScanner = null;

    auth.onAuthStateChanged((user) => {
      if (user) {
        usuarioActual = user;
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('panel-box').style.display = 'block';
        document.getElementById('user-email').innerText = user.email;
        cargarCarteles(user.uid);
      } else {
        usuarioActual = null;
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('panel-box').style.display = 'none';
      }
    });

    function iniciarSesion() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errBox = document.getElementById('error-login');
      errBox.innerText = 'Verificando...';

      if (!email || !pass) {
        errBox.innerText = 'Ingresá correo y contraseña.';
        return;
      }

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => { errBox.innerText = ''; })
        .catch((err) => {
          errBox.innerText = "Error al iniciar sesión.";
        });
    }

    function cerrarSesion() {
      auth.signOut();
    }

    function cargarCarteles(uid) {
      const contenedor = document.getElementById('lista-carteles');

      db.ref('usuarios/' + uid + '/carteles').once('value').then((snapshot) => {
        const data = snapshot.val() || {};
        contenedor.innerHTML = '';
        
        for (let i = 1; i <= 150; i++) {
          const id = String(i).padStart(3, '0');
          const urlActual = data[id] || '';
          
          const card = document.createElement('div');
          card.className = 'card';
          card.id = `card-${id}`;
          card.innerHTML = `
            <div class="card-header">
              <span>Cartel #${id}</span>
              <span class="status" id="status-${id}">${urlActual ? '✅ Asignado' : '⚪ Libre'}</span>
            </div>
            <div class="quick-tools">
              <button class="btn-quick" onclick="pegarBase('${id}', 'google')">+ Google Review</button>
              <button class="btn-quick" onclick="pegarBase('${id}', 'instagram')">+ Instagram</button>
              <button class="btn-quick clear-btn" onclick="limpiarCampo('${id}')">🗑️ Vaciar</button>
            </div>
            <input type="url" id="input-${id}" value="${urlActual}" placeholder="https://..." oninput="validarUrl('${id}')">
            <div class="validation-msg" id="val-msg-${id}"></div>
            <button class="btn-save" id="btn-${id}" onclick="guardarCartel('${id}')">Guardar Link</button>
            <div class="msg-feedback" id="msg-${id}"></div>
          `;
          contenedor.appendChild(card);
        }
      });
    }

    function pegarBase(id, tipo) {
      const input = document.getElementById(`input-${id}`);
      let base = tipo === 'google' ? 'https://search.google.com/local/writereview?placeid=' : 'https://www.instagram.com/';
      input.value = base;
      validarUrl(id);
      input.focus();
      input.setSelectionRange(base.length, base.length);
    }

    function limpiarCampo(id) {
      const input = document.getElementById(`input-${id}`);
      input.value = '';
      validarUrl(id);
    }

    // VALIDACIÓN EN TIEMPO REAL (Espacios, HTTPS, Formato)
    function validarUrl(id) {
      const input = document.getElementById(`input-${id}`);
      const valMsg = document.getElementById(`val-msg-${id}`);
      const btn = document.getElementById(`btn-${id}`);
      const val = input.value;

      if (!val) {
        input.classList.remove('input-error');
        valMsg.innerText = '';
        btn.disabled = false;
        return true;
      }

      if (val.includes(' ')) {
        input.classList.add('input-error');
        valMsg.innerText = '⚠️ Atención: El enlace contiene espacios sin querer.';
        btn.disabled = true;
        return false;
      }

      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        input.classList.add('input-error');
        valMsg.innerText = '⚠️ Falta el "https://" al principio del enlace.';
        btn.disabled = true;
        return false;
      }

      input.classList.remove('input-error');
      valMsg.innerText = '';
      btn.disabled = false;
      return true;
    }

    function guardarCartel(id) {
      if (!usuarioActual || !validarUrl(id)) return;
      
      const input = document.getElementById(`input-${id}`);
      const btn = document.getElementById(`btn-${id}`);
      const statusSpan = document.getElementById(`status-${id}`);
      const msgBox = document.getElementById(`msg-${id}`);
      const url = input.value.trim();

      btn.disabled = true;
      msgBox.style.color = '#1a73e8';
      msgBox.innerText = 'Guardando...';
      
      db.ref('usuarios/' + usuarioActual.uid + '/carteles/' + id).set(url).then(() => {
        btn.disabled = false;
        msgBox.style.color = '#1e8e3e';
        msgBox.innerText = '¡Guardado con éxito!';
        statusSpan.innerText = url ? '✅ Asignado' : '⚪ Libre';
        setTimeout(() => { msgBox.innerText = ''; }, 2500);
      }).catch((err) => {
        btn.disabled = false;
        msgBox.style.color = '#d93025';
        msgBox.innerText = 'Error al guardar.';
      });
    }

    // LÓGICA DEL ESCÁNER DE CÁMARA
    function toggleEscaner() {
      const readerDiv = document.getElementById('reader');
      
      if (readerDiv.style.display === 'block') {
        if (html5QrcodeScanner) html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        return;
      }

1. **Escanear Cartel (Lector QR por cámara):** Agrega un botón flotante arriba. Si escaneás un cartel con la cámara del celular desde la web, te busca e ingresa al número de cartel automáticamente sin tener que hacer scroll.
2. **Validación Visual de Errores (Sustituto de "Probar Link"):** Revisa en tiempo real si dejaste un espacio en blanco al principio o al final (un error súper común al copiar/pegar en celular) o si el enlace no empieza con `https://`. Te muestra un aviso naranja con el error exacto antes de guardar.
3. **Botón "Vaciar":** Un botón gris para borrar el campo de un solo toque sin renegar borrando letra por letra con el teclado táctil.
