<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Carteles QR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f4f6f8; padding: 20px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 20px; text-align: center; color: #1a73e8; }
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
    input[type="url"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
    button { width: 100%; background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 5px; }
    button.logout { background: #d93025; }
    button:active { opacity: 0.8; }
    button:disabled { background: #9aa0a6; cursor: not-allowed; }
    .status { font-size: 12px; font-weight: normal; }
    .msg-feedback { font-size: 12px; font-weight: bold; text-align: center; margin-top: 5px; height: 16px; }
    .user-info { display: flex; justify-content: space-between; align-items: center; background: #e8f0fe; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
    #login-box { display: block; }
    #panel-box { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Panel de Carteles QR</h1>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-box" class="card">
      <h2 style="font-size: 16px; margin-bottom: 15px; text-align: center;">Iniciar Sesión</h2>
      <input type="email" id="email" placeholder="Correo Electrónico">
      <input type="password" id="password" placeholder="Contraseña">
      <button onclick="iniciarSesion()">Ingresar</button>
      <p id="error-login" style="color: red; font-size: 12px; margin-top: 10px; text-align: center; font-weight: bold;"></p>
    </div>

    <!-- PANTALLA DEL PANEL -->
    <div id="panel-box">
      <div class="user-info">
        <span id="user-email">Cargando...</span>
        <button class="logout" style="width: auto; padding: 5px 10px; margin: 0;" onclick="cerrarSesion()">Salir</button>
      </div>
      <div id="lista-carteles">Cargando carteles...</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCC3zrf5vYbgM7lA7ULEBE_e1bGCtt6Krg",
      authDomain: "nfccaba-5e8d5.firebaseapp.com",
      databaseURL: "https://nfccaba-5e8d5-default-rtdb.firebaseio.com",
      projectId: "nfccaba-5e8d5",
      storageBucket: "nfccaba-5e8d5.firebasestorage.app",
      messagingSenderId: "104003409871",
      appId: "1:104003409871:web:eb477d997538e01de3e4ba",
      measurementId: "G-B1BNGY8WSC"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    let usuarioActual = null;

    auth.onAuthStateChanged((user) => {
      if (user) {
        usuarioActual = user;
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('panel-box').style.display = 'block';
        document.getElementById('user-email').innerText = user.email;
        cargarCarteles(user.uid);
      } else {
        usuarioActual = null;
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('panel-box').style.display = 'none';
      }
    });

    function iniciarSesion() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      const errBox = document.getElementById('error-login');
      errBox.innerText = 'Verificando...';

      if (!email || !pass) {
        errBox.innerText = 'Ingresá correo y contraseña.';
        return;
      }

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          errBox.innerText = '';
        })
        .catch((err) => {
          console.error(err);
          let mensaje = "Error al iniciar sesión.";
          const errString = err.message || JSON.stringify(err);

          if (errString.includes("INVALID_LOGIN_CREDENTIALS") || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
            mensaje = "Correo o contraseña incorrectos.";
          } else if (err.code === "auth/invalid-email") {
            mensaje = "El formato del correo no es válido.";
          } else if (err.code === "auth/too-many-requests") {
            mensaje = "Demasiados intentos fallidos. Intentá más tarde.";
          }

          errBox.innerText = mensaje;
        });
    }

    function cerrarSesion() {
      auth.signOut();
    }

    function cargarCarteles(uid) {
      const contenedor = document.getElementById('lista-carteles');

      // Se usa .once() para cargar la interfaz rápidamente una sola vez sin tirones
      db.ref('usuarios/' + uid + '/carteles').once('value').then((snapshot) => {
        const data = snapshot.val() || {};
        contenedor.innerHTML = '';
        
        for (let i = 1; i <= 150; i++) {
          const id = String(i).padStart(3, '0');
          const urlActual = data[id] || '';
          
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <span>Cartel #${id}</span>
              <span class="status" id="status-${id}">${urlActual ? '✅ Asignado' : '⚪ Libre'}</span>
            </div>
            <input type="url" id="input-${id}" value="${urlActual}" placeholder="https://g.page/r/...">
            <button id="btn-${id}" onclick="guardarCartel('${id}')">Guardar Link</button>
            <div class="msg-feedback" id="msg-${id}"></div>
          `;
          contenedor.appendChild(card);
        }
      });
    }

    function guardarCartel(id) {
      if (!usuarioActual) return;
      const input = document.getElementById(`input-${id}`);
      const btn = document.getElementById(`btn-${id}`);
      const statusSpan = document.getElementById(`status-${id}`);
      const msgBox = document.getElementById(`msg-${id}`);
      const url = input.value.trim();

      btn.disabled = true;
      msgBox.style.color = '#1a73e8';
      msgBox.innerText = 'Guardando...';
      
      db.ref('usuarios/' + usuarioActual.uid + '/carteles/' + id).set(url).then(() => {
        btn.disabled = false;
        msgBox.style.color = '#1e8e3e';
        msgBox.innerText = '¡Guardado con éxito!';
        
        // Actualiza el indicador sin recargar toda la lista
        statusSpan.innerText = url ? '✅ Asignado' : '⚪ Libre';

        setTimeout(() => { msgBox.innerText = ''; }, 2500);
      }).catch((err) => {
        btn.disabled = false;
        msgBox.style.color = '#d93025';
        msgBox.innerText = 'Error al guardar.';
      });
    }
  </script>
</body>
</html>
